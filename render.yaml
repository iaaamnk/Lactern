services:
  - type: web
    name: youtube-video-rag
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "python run.py"
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: CACHE_DIR
        value: ./data/cache
